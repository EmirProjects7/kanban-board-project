name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The client is generated into a gitignored folder, so it has to be
      # built before anything type-checks. Generating reads the schema only;
      # the url below is a placeholder and no database is contacted.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Coverage carries thresholds, so a change that drops it fails here
      # rather than going unnoticed until someone thinks to look.
      - name: Test
        run: npm run test:coverage

      # Handed to the badges job below, which is the only place the README
      # number is written.
      - name: Save the coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage/coverage-summary.json

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Save the coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/coverage-summary.json

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # A stack that never comes up sits in the wait below doing nothing, and the
    # default limit is six hours, so a stuck run takes that long to report a
    # failure anyone could have seen in one minute.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban_e2e
      # Long enough to clear the minimum the server enforces at startup. Still
      # a throwaway: it exists for the length of one job, on a runner that is
      # destroyed afterwards.
      JWT_SECRET: e2e-secret-used-nowhere-else-and-long-enough-to-start-the-server
      BACKEND_HOST: 127.0.0.1
      BACKEND_PORT: '3000'
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3000
      # The suite registers an account per test, which the production auth
      # limit of ten per fifteen minutes would cut off partway through.
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend

      # The client is generated into a gitignored folder, so it has to exist
      # before anything compiles. Same step the backend job runs, except the
      # database here is real and migrate deploy needs it anyway.
      - name: Generate the Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Prepare the database
        run: npx prisma migrate deploy
        working-directory: backend

      - run: npm run build --prefix backend
      - run: npm run build --prefix frontend

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Both halves run from their build, so the suite exercises what a build
      # actually produces rather than what the dev servers do.
      #
      # localhost rather than 127.0.0.1 in the wait: vite preview binds ::1
      # only, so the dotted spelling never answers and the step hangs. It is
      # also the spelling CORS and the socket handshake are pinned to.
      - name: Start the stack
        run: |
          npm start --prefix backend > backend.log 2>&1 &
          npm run preview --prefix frontend -- --port 5173 --strictPort > frontend.log 2>&1 &
          npx --yes wait-on http://localhost:3000/health http://localhost:5173 --timeout 90000

      - name: Run the E2E suite
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173

      # Only useful when the stack got as far as starting, so a missing file
      # here should not bury the error that actually failed the job.
      - name: Server logs
        if: failure()
        run: tail -n 100 backend.log frontend.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  badges:
    name: Coverage badges
    # Only on master, and only once both suites have reported. On a pull
    # request there is nothing to write to yet.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Back into the paths the script reads, so it behaves the same here as
      # it does on a laptop.
      - uses: actions/download-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage

      - uses: actions/download-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Rewrite the badges from the measurement
        run: node scripts/coverage-badges.mjs --write

      # A push made with GITHUB_TOKEN does not start another run, so this
      # cannot loop back into itself.
      - name: Commit the change, if there was one
        run: |
          if git diff --quiet README.md; then
            echo "The badges already match the measurement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update the coverage badges" README.md
          git push
