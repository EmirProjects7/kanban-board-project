version: 2

updates:
  # Three manifests, none of which anybody watches by hand. Every pull request
  # raised here runs the full CI, so the suites decide whether an update is
  # safe rather than a guess about the changelog.
  - package-ecosystem: npm
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch arrive together as one pull request, which is the
      # difference between a weekly chore and a weekly inbox. Majors stay on
      # their own, since those are the ones worth reading about first.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint pins its peer to typescript <6.1.0, and 8.66.0, the
      # newest there is, still does. So TypeScript 7 cannot install here at all:
      # npm ci fails on ERESOLVE before any of our code is reached. Dependabot
      # would raise that same unmergeable pull request every week.
      #
      # Drop this once typescript-eslint accepts 7. Minor and patch updates to
      # typescript still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore

  # Pinned action versions go stale as quietly as dependencies do.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
